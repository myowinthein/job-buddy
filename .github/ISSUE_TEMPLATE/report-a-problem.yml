name: Report a problem
description: Report a problem with a Job Buddy feature, setup or guide.
body:
  - type: markdown
    attributes:
      value: |
        Reports are public. Remove API keys, resumes, profile exports and personal details from text, links and attachments.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what you expected and what happened instead. Include any error message.
      placeholder: |
        Expected: Fill Form would fill my saved phone number.
        Actual: the phone field stayed empty.
    validations:
      required: true
  - type: input
    id: page-link
    attributes:
      label: Where did it happen?
      description: Name the Job Buddy feature or share the affected site's public page link. Leave out private or account-specific links.
      placeholder: Fill Form on https://example.com/careers/job
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Share the steps or a small example we can follow. If it happens intermittently, describe what led up to it and how often it occurs.
      placeholder: |
        1. Open a job application.
        2. Open Job Buddy and click Fill Form.
        3. The phone number stays empty.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Job Buddy version
      description: Filled in when you open this form from Job Buddy. Otherwise, copy the version from the top-right corner of its popup, if known.
      placeholder: <version>
    validations:
      required: false
  - type: input
    id: browser-device
    attributes:
      label: Browser and device
      description: Include your browser and operating system, with version numbers if known.
      placeholder: Chrome on Windows, or Chrome on macOS
    validations:
      required: false
  - type: textarea
    id: extra-details
    attributes:
      label: Screenshots or extra details
      description: Share a relevant error message or screenshot. For autofill problems, a screenshot of Fill Details can help.
    validations:
      required: false
