name: Browser tests

# Manual run of the real-Chromium extension specs. No secrets, no upload, no release.
on:
  workflow_dispatch:

jobs:
  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser for extension tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm test:browser
