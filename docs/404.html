<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found · Job Buddy</title>
    <base href="./" />
    <script>
      // Keep the project-site 404 usable in both local previews and GitHub Pages.
      document.querySelector('base').href = location.pathname.startsWith('/docs/')
        ? '/docs/'
        : location.pathname.startsWith('/job-buddy/')
          ? '/job-buddy/'
          : '/';
    </script>
    <link rel="icon" href="assets/icons/icon.svg" />
    <script src="assets/theme-init.js"></script>
    <link rel="stylesheet" href="assets/site.css" />
  </head>
  <body>
    <main style="max-width: calc(var(--reading-width) + 48px); margin: 12vh auto; padding: 24px">
      <a class="brand" href="./"
        ><img src="assets/icons/icon.svg" width="32" height="32" alt="" />Job Buddy</a
      >
      <div class="intro">
        <p class="intro-note">404</p>
        <h1>This page has moved or is missing.</h1>
        <p class="lede">Find the walkthrough, developer guide and demo from the website.</p>
        <a class="button" href="./">Back to Job Buddy</a>
      </div>
    </main>
  </body>
</html>
