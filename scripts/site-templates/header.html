    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="{{root}}"
          ><img src="{{root}}assets/icons/icon.svg" width="32" height="32" alt="" />Job Buddy</a
        >
        <nav class="header-nav" aria-label="Main navigation">
          <a class="walkthrough-link" href="{{root}}"{{walkthroughCurrent}}>Walkthrough</a>
          <a href="{{root}}developers/"{{developersCurrent}}>For developers</a>
          <a
            class="demo-nav"
            href="{{root}}demo/?from={{demoFrom}}"
            rel="noopener noreferrer"
            >Try the demo</a
          >
        </nav>
        <div class="header-tools">
          <button class="theme-toggle" type="button" aria-label="Switch theme" aria-pressed="false">
            <svg
              class="theme-moon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              aria-hidden="true"
            >
              <path d="M20.9 13.2A9 9 0 0 1 10.8 3.1a9 9 0 1 0 10.1 10.1Z" />
            </svg>
            <svg
              class="theme-sun"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
              />
            </svg>
          </button>
          <a class="header-version" href="https://github.com/myowinthein/job-buddy/releases/tag/v{{version}}" aria-label="Version {{version}} release notes">v{{version}} <svg class="external-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="{{root}}assets/icons/external-link.svg#external-link" /></svg></a>
        </div>
      </div>
    </header>
